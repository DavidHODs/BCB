[tool.poetry]
name = "BCB"
version = "0.1.0"
description = "FastAPI Learning Project: Book Club API"
authors = ["DavidHODs <davidoluwatobi41@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"  # Moved from root to dependencies
fastapi = ">=0.110.0,<1.0.0"
uvicorn = { extras = ["standard"], version = ">=0.29.0,<1.0.0" }
pydantic = ">=2.10.6,<3.0.0"
sqlalchemy = ">=2.0.0,<3.0.0"
alembic = ">=1.13.1,<2.0.0"
httpx = ">=0.27.0,<1.0.0"
gunicorn = ">=22.0.0,<23.0.0"
psycopg = { extras = ["binary"], version = ">=3.1.0,<4.0.0" }

[tool.poetry.group.dev.dependencies]
mypy = ">=1.15.0,<2.0.0"
black = ">=24.3.0,<25.0.0"
isort = ">=5.13.2,<6.0.0"
pre-commit = ">=3.7.0,<4.0.0"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
