name: Lint and Run App

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache venv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: ~/.venv
          key: ${{ runner.os }}-py3.11-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --sync

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Restore virtual environment
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-py3.11-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies and ensure mypy
        run: |
          poetry install --sync
          poetry add --group=dev mypy

      - name: Run linting and formatting
        run: |
          poetry run autopep8 --aggressive --indent-size 2 --max-line-length 80 --in-place --recursive src/
          poetry run isort --line-length 80 --indent 2 src/
          poetry run ruff check --fix src/
          poetry run mypy src/

  run-app:
    name: Run FastAPI App
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Restore virtual environment
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: ${{ runner.os }}-py3.11-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --sync

      - name: Test FastAPI app
        timeout-minutes: 0.5
        run: |
          cd src && PYTHONPATH=$PYTHONPATH:$(pwd) poetry run uvicorn main:app --host 0.0.0.0 --port 9000 &
          sleep 5
          curl --retry 3 --retry-delay 2 --fail http://localhost:9000/api/v1/health-check || exit 1